<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>ELRS Radar</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="dark">
    <div id="radarContainer">
      <canvas id="radarCanvas" width="400" height="400"></canvas>
    </div>

    <div class="controls">
      <div id="feedbackEl"></div>
      <button id="enableCompass">Enable Compass</button>
    </div>

    <div class="metrics-summary">
      <span class="icon">📏</span> <span id="dist">No Drone</span> || 
      <span class="icon">📐</span> <span id="bearingDisplay">--</span>
    </div>
    
    <div class="gps-table">
      <table border="1" style="width: 100%; border-collapse: collapse;">
        <thead>
          <tr>
            <th style="text-align: right;"></th>
            <th>Drone</th>
            <th>Controller</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <th>Lat</th>
            <td><span id="droneLat">-</span></td>
            <td><span id="controllerLat">-</span></td>
          </tr>
          <tr>
            <th>Lng</th>
            <td><span id="droneLng">-</span></td>
            <td><span id="controllerLng">-</span></td>
          </tr>
          <tr>
            <th>Sats</th>
            <td><span id="droneSats">-</span></td>
            <td><span id="accuracy">-</span></td>
          </tr>
          <tr>
            <th>Alt</th>
            <td><span id="droneAltitude">-</span></td>
            <td></td>
          </tr>
        </tbody>
      </table>
    </div>
    

    <div class="diagnostics" style="margin-top: 10px;">
      Last view: <span id="lastDroneUpdate">--</span>
      <div id="feedbackElBottom"></div>
    </div>
    
    <div style="margin-top: 5px;" class="split">
      <div class="telemetry-table">
        <table border="1" style="width: 100%; border-collapse: collapse;">
          <thead>
            <tr>
              <th>Battery</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>Charge: <span id="batteryPercent">--</span></td>
            </tr>
            <tr>
              <td>Current: <span id="current">--</span></td>
            </tr>
            <tr>
              <td>mAh: <span id="mah">--</span></td>
            </tr>
            <tr>
              <td>VBAT: <span id="vbat">--</span></td>
            </tr>
          </tbody>
        </table>
      </div>

      <div class="telemetry-table">
        <table border="1" style="width: 100%; border-collapse: collapse;">
          <thead>
            <tr>
              <th>Status</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>Rx: <span id="rxRSSI">--</span></td>
            </tr>
            <tr>
              <td>Tx: <span id="txRSSI">--</span></td>
            </tr>
            <tr>
              <td>LQ: <span id="linkQuality">--</span></td>
            </tr>
            <tr>
              <td><span id="droneStatus">--</span></td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <div style="margin-top: 5px;">
      <span id="version">--</span>
    </div>

    <script type="module" src="radar.js"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", async () => {
          try {
            await navigator.serviceWorker.register("/sw.js");
            console.log("SW registered");
          } catch (e) {
            console.error(e);
          }
        });
      }
    </script>
  </body>
</html>
